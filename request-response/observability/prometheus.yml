global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # ================== FastAPI apps (scrape direto) ==================
  # Como agora os serviços expõem /metrics diretamente, fazemos scraping
  # sem passar pelo sidecar Dapr (evita latência e duplicidade de métricas).
  - job_name: "fastapi-apps"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          app_id: "gateway"
          service_type: "fastapi"
      - targets: ["worker:8080"]
        labels:
          app_id: "worker"
          service_type: "fastapi"

  # ================== Dapr sidecars ==================
  # Os sidecars compartilham network namespace com os apps (network_mode: service:...) 
  # portanto os targets são os próprios nomes dos serviços app.
  - job_name: "dapr-sidecars"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:9092", "worker:9091"]
        labels:
          component: "dapr-sidecar"

  # ================== OTEL Spanmetrics -> Prometheus ==================
  - job_name: "otel-spanmetrics"
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]